name: Build & Publish Browser Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vector-velocity-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Inspect Web export prerequisites
        run: |
          echo "Godot editor version:"
          godot --version
          echo "Godot Web export template files:"
          find "${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates" -maxdepth 2 -type f -name 'web*zip' -print 2>/dev/null || true
          echo "Web export preset:"
          grep -E '^(name=|platform=|variant/thread_support=|vram_texture_compression/for_mobile=)' export_presets.cfg
      - name: Import and validate project
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|Invalid call' /tmp/godot-import.log; then
            echo "::error::Godot import or GDScript parser failed"
            exit 1
          fi
      - name: Headless game startup smoke test
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 100 2>&1 | tee /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|Invalid call' /tmp/godot-run.log; then
            echo "::error::Godot encountered script/runtime errors during startup"
            exit 1
          fi
      - name: Verify the player lands on the collision mesh
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/ground_contact.gd 2>&1 | tee /tmp/godot-collision.log
          grep -F 'PASS: terrain raycast hit and player grounded' /tmp/godot-collision.log
      - name: Verify sliding, obstacles, and storm rules
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/gameplay_rules.gd 2>&1 | tee /tmp/godot-gameplay.log
          grep -F 'PASS: slide-only acceleration, unlimited speed, hazards, and advancing storm' /tmp/godot-gameplay.log
      - name: Export HTML5 with a unique release path
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${RELEASE_SHA:0:12}"
          RELEASE_DIR="build/web/releases/$SHORT_SHA"
          mkdir -p "$RELEASE_DIR"
          godot --headless --path . --export-release "Web" "$RELEASE_DIR/index.html" 2>&1 | tee /tmp/godot-export.log
          test -s "$RELEASE_DIR/index.html"
          test -s "$RELEASE_DIR/index.js"
          test -s "$RELEASE_DIR/index.wasm"
          test -s "$RELEASE_DIR/index.pck"
          # Keep the public address stable. A full-viewport iframe loads
          # the uniquely versioned engine files without redirecting the tab.
          cat > build/web/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <title>Vector Velocity · $SHORT_SHA</title>
          <style>html,body{width:100%;height:100%;margin:0;background:#070819;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
          </head>
          <body>
          <iframe id="game" title="Vector Velocity" src="./releases/$SHORT_SHA/index.html" allow="fullscreen; autoplay; gamepad" allowfullscreen tabindex="0"></iframe>
          <script>const game=document.getElementById('game');game.addEventListener('load',()=>{game.focus();});</script>
          </body>
          </html>
          EOF
          # Repair old bookmarks/tabs that point to removed release directories.
          # A cache-busting query also bypasses any cached old redirect page.
          cat > build/web/404.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Vector Velocity — Updated</title>
          <style>body{background:#070819;color:#e8faff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;text-align:center}a{color:#2aebff}</style>
          </head>
          <body>
          <main><h1>VECTOR VELOCITY</h1><p>This release has been replaced.</p><p><a href="/Cracked/?v=$SHORT_SHA">Open the latest build</a></p></main>
          <script>if(location.pathname.startsWith('/Cracked/releases/'))location.replace('/Cracked/?v=$SHORT_SHA');</script>
          </body>
          </html>
          EOF
          # Insert a persistent build ID into the real game page.
          python3 - "$RELEASE_DIR/index.html" "$SHORT_SHA" <<'PY'
          import pathlib, sys
          page = pathlib.Path(sys.argv[1])
          sha = sys.argv[2]
          html = page.read_text(encoding="utf-8")
          badge = (f'<aside id="build-id" aria-label="Game version" style="position:fixed;'
                   f'top:8px;right:10px;z-index:100;pointer-events:none;'
                   f'background:rgba(2,8,26,.7);color:#a9faff;padding:4px 8px;'
                   f'font:12px monospace;border:1px solid #31748e;'
                   f'border-radius:4px">BUILD {sha}</aside>')
          if '</body>' not in html:
              raise SystemExit("Cannot find closing body in exported Godot HTML")
          page.write_text(html.replace('</body>', badge + '</body>', 1), encoding="utf-8")
          PY
          printf '%s\n' "$SHORT_SHA" > build/web/version.txt
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/version.txt
          test -s build/web/404.html
          grep -F "./releases/$SHORT_SHA/index.html" build/web/index.html
          echo "Published stable URL: https://unborne-fetus.github.io/Cracked/?v=$SHORT_SHA"
      - name: Publish readable CI result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DETAIL="Godot import, headless tests and browser export passed"
          else
            STATE="failure"
            DETAIL="Build failed; see Actions logs"
            for LOG in /tmp/godot-export.log /tmp/godot-gameplay.log /tmp/godot-collision.log /tmp/godot-run.log /tmp/godot-import.log; do
              if [ -f "$LOG" ]; then
                LINE=$(grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAILED|Assertion failed|GAMEPLAY REGRESSION:|GROUND COLLISION REGRESSION:' "$LOG" | tail -n 1 || true)
                if [ -n "$LINE" ]; then
                  DETAIL="$(printf "%s" "$LINE" | tr -cd '[:print:]' | cut -c1-135)"
                  break
                fi
              fi
            done
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="cracked/godot-build" \
            -f description="$DETAIL" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: vector-velocity-web
          path: build/web/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
