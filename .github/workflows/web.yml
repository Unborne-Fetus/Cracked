name: Build & Publish Browser Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beatbreak-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and rhythm rules
        run: |
          node --check site/core.js
          node --check site/game.js
          node tests/rhythm.test.cjs
      - name: Prepare versioned website
        run: |
          mkdir -p build/web
          cp -R site/. build/web/
          printf 'V. 0.%s\n' "$GITHUB_RUN_NUMBER" > build/web/version.txt
          touch build/web/.nojekyll
          sed -i "s|</body>|<small style='position:fixed;bottom:4px;right:6px;color:#9c90b1;font:10px monospace'>V. 0.$GITHUB_RUN_NUMBER</small></body>|" build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
