name: Build & Publish Browser Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vector-velocity-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import and validate project
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' /tmp/godot-import.log
      - name: Headless game startup smoke test
        run: |
          godot --headless --path . --quit-after 100 2>&1 | tee /tmp/godot-run.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|Invalid call' /tmp/godot-run.log
      - name: Export HTML5
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: vector-velocity-web
          path: build/web/
      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
