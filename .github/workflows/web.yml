name: Build & Publish Browser Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vector-velocity-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Inspect Web export prerequisites
        run: |
          echo "Godot editor version:"
          godot --version
          echo "Godot Web export template files:"
          find "${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates" -maxdepth 2 -type f -name 'web*zip' -print 2>/dev/null || true
          echo "Web export preset:"
          grep -E '^(name=|platform=|variant/thread_support=|vram_texture_compression/for_mobile=)' export_presets.cfg
      - name: Import and validate project
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|Invalid call' /tmp/godot-import.log; then
            echo "::error::Godot import or GDScript parser failed"
            exit 1
          fi
      - name: Headless game startup smoke test
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 100 2>&1 | tee /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|Invalid call' /tmp/godot-run.log; then
            echo "::error::Godot encountered script/runtime errors during startup"
            exit 1
          fi
      - name: Verify the player lands on the collision mesh
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/ground_contact.gd 2>&1 | tee /tmp/godot-collision.log
          grep -F 'PASS: terrain raycast hit and player grounded' /tmp/godot-collision.log
      - name: Verify sliding, obstacles, and storm rules
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/gameplay_rules.gd 2>&1 | tee /tmp/godot-gameplay.log
          grep -F 'PASS: slide-only acceleration, unlimited speed, hazards, and advancing storm' /tmp/godot-gameplay.log
      - name: Export HTML5
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - name: Publish readable CI result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DETAIL="Godot import, headless tests and browser export passed"
          else
            STATE="failure"
            DETAIL="Build failed; see Actions logs"
            for LOG in /tmp/godot-export.log /tmp/godot-gameplay.log /tmp/godot-collision.log /tmp/godot-run.log /tmp/godot-import.log; do
              if [ -f "$LOG" ]; then
                LINE=$(grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAILED|Assertion failed|GAMEPLAY REGRESSION:|GROUND COLLISION REGRESSION:' "$LOG" | tail -n 1 || true)
                if [ -n "$LINE" ]; then
                  DETAIL="$(printf "%s" "$LINE" | tr -cd '[:print:]' | cut -c1-135)"
                  break
                fi
              fi
            done
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="cracked/godot-build" \
            -f description="$DETAIL" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: vector-velocity-web
          path: build/web/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
