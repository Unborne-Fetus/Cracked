<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BEATBREAK</title><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="game.js"></script></head><body>
<canvas id="stage" aria-label="Rhythm arena and note highway"></canvas>
<header id="hud" hidden><div><small id="songName"></small><strong id="score">0</strong><span>SCORE</span></div><div class="center"><strong id="combo">0×</strong><span id="mult">1× MULTIPLIER</span></div><div class="right"><button id="pauseButton">Ⅱ</button><small>GROOVE</small><div class="meter"><i id="energy"></i></div></div><div class="progress"><i id="progress"></i></div></header>
<main id="menu" class="overlay"><section class="panel"><p class="eyebrow">CRACKED / RHYTHM ACTION</p><h1>BEAT<span>BREAK</span></h1><p class="tag">Own the beat. Control the floor.</p><h2>SELECT A TRACK</h2><div id="songs"></div><h2>DIFFICULTY</h2><div class="choices"><button data-level="easy">EASY</button><button data-level="normal">NORMAL</button><button data-level="hard">HARD</button></div><p id="record"></p><button class="primary" id="start">START SET <span>↗</span></button><details><summary>Audio & timing settings</summary><label>Music volume <input id="volume" type="range" min="0" max="100"></label><label>Timing offset <input id="offset" type="range" min="-200" max="200" step="5"><output id="offsetValue"></output></label></details><p class="help">A S D F G — hit the notes • SPACE — dodge white notes<br>Controller: D-pad left, A B X Y, RB • Touch: tap the pads</p><p id="error" role="alert"></p></section></main>
<section id="pause" class="overlay" hidden><div class="panel compact"><h1>PAUSED</h1><button class="primary" id="resume">RESUME</button><button id="quit">TRACK SELECT</button></div></section>
<section id="result" class="overlay" hidden><div class="panel compact"><p class="eyebrow" id="resultTitle"></p><div id="grade">S</div><h1 id="resultScore">0</h1><p id="resultStats"></p><button class="primary" id="retry">PLAY AGAIN</button><button id="resultMenu">TRACK SELECT</button></div></section>
<nav id="touch" hidden aria-label="Rhythm inputs"><button data-lane="0" style="--lane:#6bfab0">A</button><button data-lane="1" style="--lane:#ff648b">S</button><button data-lane="2" style="--lane:#ffda65">D</button><button data-lane="3" style="--lane:#65baff">F</button><button data-lane="4" style="--lane:#bd85ff">G</button><button data-lane="5" style="--lane:#f8f9ff">DODGE</button></nav></body></html>
